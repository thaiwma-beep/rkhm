<style>

</style></head><body>
<div id="loginScreen" style="position:fixed;inset:0;background:#22123e;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;border-radius:20px;padding:28px;width:100%;max-width:420px;text-align:center"><div style="font-size:42px">🥫</div><h2 style="margin:8px 0 2px">OK1 ERP</h2><p style="color:#666;font-size:13px;margin:0 0 16px">ระบบร้านผลิตอาหาร — น้ำพริกเผา • หมูหยอง • ไส้กรอก</p><label style="display:block;text-align:left">ชื่อผู้ใช้ (เลือกจากรายชื่อใน Sheet)</label><select id="loginName"><option value="เจ้าของ">เจ้าของ (owner)</option><option value="แอดมิน">แอดมิน (admin)</option><option value="คนผลิต">คนผลิต (staff)</option><option value="สำนักงานบัญชี">สำนักงานบัญชี (accounting)</option></select><div style="height:10px"></div><label style="display:block;text-align:left">รหัสผ่าน</label><input id="loginPass" type="password" placeholder="ใส่รหัสผ่านของผู้ใช้นั้น"><p style="font-size:12px;color:#888;margin:8px 0 0">รหัสเริ่มต้น: เจ้าของ <b>1111</b> • แอดมิน <b>2222</b> • คนผลิต <b>3333</b> • สำนักงานบัญชี <b>4444</b></p><div style="height:14px"></div><button class="btn gold" style="width:100%" onclick="doLogin()">🔓 เข้าสู่ระบบ</button><p id="loginErr" style="color:#c00;font-size:13px;display:none">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p></div></div>
<header><button class="hamburger" onclick="toggleMobileMenu()">☰ เมนู</button><div><b>OK1 <span>ERP</span></b> &nbsp;ระบบร้านผลิตอาหาร — น้ำพริกเผา • หมูหยอง • ไส้กรอก</div>
<div class="flex"><span id="conn" class="pill">● โหมดทดลอง (Demo)</span><select id="roleSel" style="width:auto" onchange="setRole(this.value)"><option value="owner">บทบาท: เจ้าของ</option><option value="admin">แอดมิน</option><option value="staff">พนักงาน / คนผลิต</option><option value="accounting">สำนักงานบัญชี</option></select><button class="btn gold small" onclick="doLogout()">🚪 ออกจากระบบ</button></div></header><div class="navBackdrop" id="navBackdrop" onclick="toggleMobileMenu(true)"></div>

<script>
// ============ DEMO DATA — ตรงกับไฟล์เดิม ============
const DEMO = {

  {date:'2026-11-23',no:'ORD-004',customer:'อารีย์',product:'น้ำพริกเผาโฮมเมด',qty:30,unit:'กระปุก',total:4500,channel:'เครดิต',status:'สำเร็จ'},
  {date:'2026-11-22',no:'ORD-005',customer:'ร้านค้าปลีก',product:'หมูหยองพรีเมียม',qty:10,unit:'กระปุก',total:1800,channel:'เงินสด',status:'ยกเลิก'},
 ],
 Products:[
  {code:'P-001',name:'น้ำพริกเผาโฮมเมด',unit:'กระปุก',price:150,stock:120,status:'ใช้งาน'},
  {code:'P-002',name:'หมูหยองพรีเมียม',unit:'กระปุก',price:180,stock:45,status:'ใช้งาน'},
  {code:'P-003',name:'เครื่องปรุงไส้กรอก',unit:'ถุง',price:300,stock:30,status:'ใช้งาน'},
  {code:'P-801',name:'สินค้าพิเศษ P-801',unit:'กระปุก',price:199,stock:0,status:'ใช้งาน'},],
 Stock:[

  {code:'RM-003',name:'พริกแห้ง จินดา',qty:8,unit:'กก.',min:10,status:'วัตถุดิบใกล้หมด',exp:'2027-03-01'},
  {code:'RM-004',name:'กระปุก',qty:500,unit:'ใบ',min:100,status:'ปกติ',exp:'-'},

  {name:'ร้านค้าปลีก กรุงเทพมหานคร',type:'เครดิต',phone:'02-xxx-xxxx',province:'กรุงเทพมหานคร',addr:'-',status:'ใช้งาน'},
 ],
 Suppliers:[
  {name:'ซัพพลายเออร์ หมูสด',phone:'เบอร์หลัก 081-xxx-xxxx',credit:'เครดิต 7 วัน',status:'ใช้งาน'},
  {name:'ซัพพลายเออร์ พริกแห้ง',phone:'-',credit:'เงินสด',status:'พักการสั่งซื้อ'},
 ],
 Production:[
  {date:'2026-11-25',product:'น้ำพริกเผาโฮมเมด',qty:50,unit:'กระปุก',worker:'คนผลิต กะเช้า',shift:'กะเช้า',material:'เบิกใช้ผลิต: พริกแห้ง 5 กก.',status:'รอผลิต'},
  {date:'2026-11-24',product:'หมูหยองพรีเมียม',qty:100,unit:'กระปุก',worker:'คนผลิต กะเช้า',shift:'กะเช้า',material:'เบิกใช้ผลิต: หมูบด 20 กก.',status:'สำเร็จ'},
 ],
 Accounting:[
  {month:'2026-11',income:128500,expense:76400,locked:false,note:'รอส่งต่อสำนักงานบัญชี'},
  {month:'2026-10',income:112000,expense:69000,locked:true,note:'ส่งแล้ว / ล็อคแล้ว'},
 ],
 Users:[
  {name:'เจ้าของ',role:'owner',pass:'1111',note:'ดูได้ทุกอย่าง / ล็อคยอดเดือนได้'},
  {name:'แอดมิน',role:'admin',pass:'2222',note:'จัดการออเดอร์ สต็อก ผลิต'},
  {name:'คนผลิต',role:'staff',pass:'3333',note:'ดูผลิต + เบิกวัตถุดิบ'},
  {name:'สำนักงานบัญชี',role:'accounting',pass:'4444',note:'ดูบัญชีอย่างเดียว'},
 ],
};
var DEFAULT_DEMO = JSON.parse(JSON.stringify(DEMO));
let ROLE='owner';
let CURRENT='dashboard';
let FILTER={q:'',status:'ทั้งหมด'};
let API=localStorage.getItem('ok1_api')||'';
let LIVE=null; // ข้อมูลจริงจาก Sheet ถ้าเชื่อมแล้ว

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
function setRole(v){ROLE=v;toast('เปลี่ยนบทบาทเป็น: '+v);render();}
function saveApi(){const v=document.getElementById('apiUrl').value.trim();if(!v)return alert('วาง URL Apps Script ก่อน');localStorage.setItem('ok1_api',v);API=v;document.getElementById('conn').textContent='● เชื่อม Google Sheet แล้ว';toast('บันทึก URL แล้ว กำลังโหลดข้อมูลจริง...');loadAll();}
async function loadAll(){
  if(!API) return;
  try{const r=await fetch(API+'?action=getAll');const j=await r.json();if(j.ok&&j.data){LIVE=normalizeData(j.data);document.getElementById('conn').textContent='● เชื่อม Google Sheet แล้ว';render();}}catch(e){toast('เชื่อม Sheet ไม่สำเร็จ: '+e.message);}
}
const KEYMAP={'ชื่อลูกค้า':'name','ชื่อ':'name','ประเภท':'type','เบอร์หลัก':'phone','จังหวัด':'province','ที่อยู่':'addr','สถานะ':'status','รหัส':'code','สินค้า':'name','หน่วย':'unit','ราคา':'price','สต็อก':'stock','วัตถุดิบ':'name','จำนวน':'qty','ขั้นต่ำ':'min','วันหมดอายุ':'exp','วันที่':'date','เลขที่':'no','ลูกค้า':'customer','ยอด':'total','ช่องทาง':'channel','ชื่อซัพพลายเออร์':'name','เครดิต':'credit','คนผลิต':'worker','กะ':'shift','เบิกใช้ผลิต':'material','เดือน':'month','รายรับ':'income','รายจ่าย':'expense','หมายเหตุ':'note','ล็อคแล้ว':'locked','ชื่อผู้ใช้':'name','รหัสผ่าน':'pass','บทบาท':'role','สิทธิ์':'note','ตัวชี้วัด':'name','ค่า':'price'};
function normalizeRow(r){const o={};Object.keys(r||{}).forEach(k=>{const nk=KEYMAP[k]||k;o[nk]=r[k];});if(o.date&&typeof o.date==='string'&&o.date.includes('T'))o.date=o.date.slice(0,10);return o;}
function normalizeData(data){const out={};Object.keys(data||{}).forEach(k=>{out[k]=(data[k]||[]).map(normalizeRow);});return out;}
function dataFor(key){ if(LIVE&&LIVE[key]&&LIVE[key].length) return LIVE[key]; return DEMO[key]||[]; }
function badge(s){
  const m={'รอคอนเฟิร์ม':'warn','รอผลิต':'warn','ส่งแล้ว':'info','สำเร็จ':'ok','สำเร็จ ':'ok','ยกเลิก':'bad','ใช้งาน':'ok','พักการสั่งซื้อ':'bad','วัตถุดิบใกล้หมด':'bad','ปกติ':'ok','ล็อคแล้ว':'bad','ส่งออก':'info'};
  return `<span class="badge ${m[s]||'gray'}">${s}</span>`;
}
function money(n){return Number(n||0).toLocaleString('th-TH')+' ฿';}
function table(heads,rows){return `<div style="overflow-x:auto"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function filterRows(rows,fields){let out=rows;if(FILTER.q){const q=FILTER.q.toLowerCase();out=out.filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(q)));}if(FILTER.status!=='ทั้งหมด'){out=out.filter(r=>Object.values(r).includes(FILTER.status));}return out;}
function searchBar(statuses){return `<div class="toolbar"><input placeholder="🔍 ค้นหา..." value="${FILTER.q}" oninput="FILTER.q=this.value;render()"><select style="max-width:180px" onchange="FILTER.status=this.value;render()"><option>ทั้งหมด</option>${statuses.map(s=>`<option ${FILTER.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn ghost" onclick="FILTER={q:'',status:'ทั้งหมด'};render()">ล้างตัวกรอง</button></div>`;}

const NAV=[
 {k:'dashboard',t:'แดชบอร์ด',i:'📊',g:'หลัก'},
 {k:'orders',t:'ออเดอร์ / ขาย',i:'🧾',g:'ขาย'},
 {k:'customers',t:'ลูกค้า',i:'👥',g:'ขาย'},
 {k:'products',t:'สินค้า',i:'🥫',g:'สินค้า'},
 {k:'stock',t:'สต็อกวัตถุดิบ',i:'📦',g:'สินค้า'},
 {k:'production',t:'ผลิต',i:'🏭',g:'ผลิต'},
 {k:'suppliers',t:'ซัพพลายเออร์',i:'🚚',g:'ซื้อ'},
 {k:'accounting',t:'บัญชี / ล็อคยอดเดือน',i:'🧮',g:'บัญชี'},
 {k:'users',t:'ผู้ใช้ / บทบาท',i:'👤',g:'ตั้งค่า'},
 {k:'settings',t:'ตั้งค่าเชื่อม Sheet',i:'⚙️',g:'ตั้งค่า'},
];
var PERMS={owner:['dashboard','orders','customers','products','stock','production','suppliers','accounting','users','settings'],admin:['dashboard','orders','customers','products','stock','production','suppliers','accounting','settings'],staff:['dashboard','orders','production','stock','products'],accounting:['dashboard','orders','customers','accounting']};
function allowedPages(){return PERMS[ROLE]||PERMS['owner'];}
function userList(){var live=[];try{live=dataFor('Users');}catch(e){}if(live&&live.length)return live;return DEMO.Users;}
function refreshLoginUsers(){var sel=document.getElementById('loginName');if(!sel)return;var users=userList();var cur=sel.value;sel.innerHTML=users.map(function(u){return '<option value="'+(u.name||'')+'">'+(u.name||'')+' ('+(u.role||'')+')</option>';}).join('');if(cur)sel.value=cur;}
function toggleMobileMenu(forceClose){
  var nav=document.getElementById('nav');
  var bd=document.getElementById('navBackdrop');
  if(!nav) return;
  var willOpen = forceClose ? false : !nav.classList.contains('open');
  nav.classList.toggle('open', willOpen);
  if(bd) bd.style.display = willOpen ? 'block' : 'none';
  document.body.style.overflow = willOpen ? 'hidden' : '';
  var hb=document.querySelector('.hamburger'); if(hb) hb.textContent = willOpen ? '✕ ปิดเมนู' : '☰ เมนู';
}
function renderNav(){let g='';var allow=allowedPages();document.getElementById('nav').innerHTML=`<button class="logoutNav" onclick="doLogout()">🚪 ออกจากระบบ</button><button class="closeNav" onclick="toggleMobileMenu(true)">✕ ปิดเมนู</button>`+NAV.filter(function(n){return allow.indexOf(n.k)>=0;}).map(function(n){let h='';if(n.g!==g){g=n.g;h=`<h4>${g.toUpperCase()}</h4>`;}return h+`<button class="${CURRENT===n.k?'active':''}" onclick="go('${n.k}')">${n.i} ${n.t}</button>`;}).join('');renderMobileNav();}
function renderMobileNav(){var el=document.getElementById('mobileNav');if(!el)return;var allow=allowedPages();el.innerHTML=NAV.filter(function(n){return allow.indexOf(n.k)>=0;}).map(function(n){return `<button class="${CURRENT===n.k?'active':''}" onclick="go('${n.k}')">${n.i} ${n.t}</button>`;}).join('')+`<button style="background:#a00!important" onclick="doLogout()">🚪 ออก</button>`;}
function go(k){if(allowedPages().indexOf(k)<0){toast('บทบาทนี้ไม่มีสิทธิ์เข้าเมนูนี้');return;}CURRENT=k;var nv=document.getElementById('nav');if(nv)nv.classList.remove('open');var bd=document.getElementById('navBackdrop');if(bd)bd.style.display='none';document.body.style.overflow='';var hb=document.querySelector('.hamburger');if(hb)hb.textContent='☰ เมนู';render();}
function render(){refreshLoginUsers();renderNav();const el=document.getElementById('page');if(CURRENT==='dashboard')el.innerHTML=pageDashboard();else if(CURRENT==='orders')el.innerHTML=pageOrders();else if(CURRENT==='products')el.innerHTML=pageProducts();else if(CURRENT==='stock')el.innerHTML=pageStock();else if(CURRENT==='customers')el.innerHTML=pageCustomers();else if(CURRENT==='suppliers')el.innerHTML=pageSuppliers();else if(CURRENT==='production')el.innerHTML=pageProduction();else if(CURRENT==='accounting')el.innerHTML=pageAccounting();else if(CURRENT==='users')el.innerHTML=pageUsers();else if(CURRENT==='settings')el.innerHTML=pageSettings();window.scrollTo(0,0);}

function addUser(){
  var name=(document.getElementById('uName')||{}).value||'';
  var pass=(document.getElementById('uPass')||{}).value||'';
  var role=(document.getElementById('uRole')||{}).value||'staff';
  var note=(document.getElementById('uNote')||{}).value||'';
  if(!name||!pass) return alert('ใส่ชื่อผู้ใช้กับรหัสผ่านก่อน');
  if(!API){ DEMO.Users.push({name:name,role:role,pass:pass,note:note}); toast('เพิ่มผู้ใช้แล้ว (โหมดทดลอง)'); render(); return; }
  fetch(API,{method:'POST',body:JSON.stringify({action:'saveRow',sheet:'Users',values:[name,pass,role,note]})}).then(function(r){return r.json();}).then(function(j){ if(j.ok){ toast('เพิ่มผู้ใช้แล้ว ✅'); loadAll(); } else toast('เพิ่มไม่สำเร็จ: '+(j.error||'')); });
}

var EDITING_CUSTOMER='';
function editCustomer(i){
  var rows=dataFor('Customers'); var c=rows[i]; if(!c) return;
  EDITING_CUSTOMER=c.name;
  var set=function(id,v){var el=document.getElementById(id);if(el)el.value=v||'';};
  set('cName',c.name); set('cType',c.type); set('cPhone',c.phone); set('cProv',c.province); set('cAddr',c.addr);
  var title=document.getElementById('custFormTitle'); if(title) title.textContent='✏️ แก้ไขลูกค้า: '+c.name;
  var btn=document.getElementById('custSaveBtn'); if(btn) btn.textContent='💾 บันทึกการแก้ไข';
  var cancel=document.getElementById('custCancelBtn'); if(cancel) cancel.style.display='inline-block';
  document.getElementById('cName').scrollIntoView({behavior:'smooth'});
  toast('กำลังแก้ไข: '+c.name);
}
function cancelEditCustomer(){
  EDITING_CUSTOMER='';
  ['cName','cPhone','cAddr'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  var cp=document.getElementById('cProv'); if(cp) cp.value='กรุงเทพมหานคร';
  var title=document.getElementById('custFormTitle'); if(title) title.textContent='➕ เพิ่มลูกค้า';
  var btn=document.getElementById('custSaveBtn'); if(btn) btn.textContent='บันทึกลูกค้า';
  var cancel=document.getElementById('custCancelBtn'); if(cancel) cancel.style.display='none';
}
function checkLogin(){
  var u=localStorage.getItem('ok1_user');
  var ls=document.getElementById('loginScreen');
  if(!u){ if(ls) ls.style.display='flex'; return false; }
  try{ var obj=JSON.parse(u); ROLE=obj.role||'owner'; var rs=document.getElementById('roleSel'); if(rs) rs.value=ROLE; }catch(e){}
  if(ls) ls.style.display='none';
  return true;
}
function doLogin(){
  var name=(document.getElementById('loginName')||{}).value||'';
  var pass=(document.getElementById('loginPass')||{}).value||'';
  if(!name) return alert('เลือกชื่อผู้ใช้ก่อน');
  var users=userList(); var found=null;
  for(var i=0;i<users.length;i++){ if(String(users[i].name)===String(name)) found=users[i]; }
  var role=found?(found.role||'owner'):'owner';
  var correct=found?String(found.pass||''):'';
  var ok=false;
  if(correct&&pass===correct) ok=true;
  else if(!correct&&pass==='1234') ok=true;
  else if(pass==='1234'&&!LIVE) ok=true;
  if(!ok){ var e=document.getElementById('loginErr'); if(e) e.style.display='block'; return; }
  localStorage.setItem('ok1_user', JSON.stringify({name:name, role:role}));
  ROLE=role; CURRENT='dashboard';
  var rs=document.getElementById('roleSel'); if(rs) rs.value=role;
  var ls=document.getElementById('loginScreen'); if(ls) ls.style.display='none';
  toast('ยินดีต้อนรับ '+name+' (บทบาท: '+role+')'); render();
}
function doLogout(){
  if(!confirm('ออกจากระบบใช่ไหม?')) return;
  localStorage.removeItem('ok1_user');
  var nv=document.getElementById('nav'); if(nv) nv.classList.remove('open');
  var bd=document.getElementById('navBackdrop'); if(bd) bd.style.display='none';
  document.body.style.overflow='';
  var hb=document.querySelector('.hamburger'); if(hb) hb.textContent='☰ เมนู';
  var ls=document.getElementById('loginScreen'); if(ls) ls.style.display='flex';
  var lp=document.getElementById('loginPass'); if(lp) lp.value='';
  toast('ออกจากระบบแล้ว');
}
function addRow(kind){
  var sheet=kind, values=[];
  if(kind==='Customers'){
    var name=(document.getElementById('cName')||{}).value||'';
    var type=(document.getElementById('cType')||{}).value||'ปลีก';
    var phone=(document.getElementById('cPhone')||{}).value||'';
    var prov=(document.getElementById('cProv')||{}).value||'';
    var addr=(document.getElementById('cAddr')||{}).value||'';
    if(!name) return alert('ใส่ชื่อลูกค้าก่อน');
    values=[name,type,phone,prov,addr,'ใช้งาน'];
    if(!API){ if(EDITING_CUSTOMER){ var ex=DEMO.Customers.find(function(x){return x.name===EDITING_CUSTOMER;}); if(ex){ex.name=name;ex.type=type;ex.phone=phone;ex.province=prov;ex.addr=addr;} } else DEMO.Customers.push({name:name,type:type,phone:phone,province:prov,addr:addr,status:'ใช้งาน'}); toast('บันทึกแล้ว (โหมดทดลอง)'); cancelEditCustomer(); render(); return; }
    if(EDITING_CUSTOMER){
      fetch(API,{method:'POST',body:JSON.stringify({action:'updateRow',sheet:sheet,key:EDITING_CUSTOMER,values:values})}).then(function(r){return r.json();}).then(function(j){ if(j.ok){toast('แก้ไขลูกค้าเรียบร้อย ✅');cancelEditCustomer();loadAll();} else toast('แก้ไขไม่สำเร็จ: '+(j.error||'')); });
      return;
    }
  } else if(kind==='Products'){
    var pn=(document.getElementById('pName')||{}).value||'';
    var pp=Number((document.getElementById('pPrice')||{}).value||0);
    var pu=(document.getElementById('pUnit')||{}).value||'กระปุก';
    if(!pn) return alert('ใส่ชื่อสินค้าก่อน');
    values=['P-'+Math.floor(Math.random()*900+100),pn,pu,pp,0,'ใช้งาน'];
    if(!API){ DEMO.Products.push({code:values[0],name:pn,unit:pu,price:pp,stock:0,status:'ใช้งาน'}); toast('บันทึกแล้ว (โหมดทดลอง)'); render(); return; }
  } else { toast('บันทึกแล้ว (โหมดทดลอง)'); return; }
  fetch(API,{method:'POST',body:JSON.stringify({action:'saveRow',sheet:sheet,values:values})}).then(function(r){return r.json();}).then(function(j){ if(j.ok){toast('บันทึกลง Sheet แล้ว ✅');loadAll();} else toast('บันทึกไม่สำเร็จ: '+(j.error||'')); }).catch(function(e){toast('บันทึกไม่สำเร็จ: '+e.message);});
}

function addProduction(){
  var prod=(document.getElementById('prProduct')||{}).value||'';
  var qty=Number((document.getElementById('prQty')||{}).value||0);
  var shift=(document.getElementById('prShift')||{}).value||'กะเช้า';
  var material=(document.getElementById('prMaterial')||{}).value||'';
  if(!prod) return alert('เลือกสินค้าที่จะผลิตก่อน');
  if(!qty||qty<=0) return alert('ใส่จำนวนที่มากกว่า 0');
  var pr=dataFor('Products').find(function(x){return x.name===prod;})||{};
  var unit=pr.unit||'กระปุก';
  var worker='คนผลิต';
  try{ var u=JSON.parse(localStorage.getItem('ok1_user')||'{}'); if(u.name) worker=u.name; }catch(e){}
  var today=new Date(); var date=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var values=[date,prod,qty,unit,worker,shift,material,'รอผลิต'];
  var msg=document.getElementById('prMsg');
  if(!API){
    DEMO.Production.push({date:date,product:prod,qty:qty,unit:unit,worker:worker,shift:shift,material:material,status:'รอผลิต'});
    if(msg) msg.textContent=' สั่งผลิต '+prod+' '+qty+' '+unit+' แล้ว (โหมดทดลอง)';
    toast('สั่งผลิตแล้ว ✅'); render(); return;
  }
  if(msg) msg.textContent=' กำลังบันทึก...';
  fetch(API,{method:'POST',body:JSON.stringify({action:'saveRow',sheet:'Production',values:values})}).then(function(r){return r.json();}).then(function(j){
    if(j.ok){ if(msg) msg.textContent=' บันทึกสั่งผลิต '+prod+' '+qty+' '+unit+' ลงชีต Production แล้ว ✅'; toast('บันทึกสั่งผลิตแล้ว ✅'); loadAll(); }
    else { if(msg) msg.textContent=''; toast('บันทึกไม่สำเร็จ: '+(j.error||'เซิร์ฟเวอร์ไม่ตอบ')); }
  }).catch(function(e){ if(msg) msg.textContent=''; toast('บันทึกไม่สำเร็จ: '+e.message); });
}
function resetDatabase(){
  if(ROLE!=='owner') return alert('เฉพาะเจ้าของเท่านั้นที่เซ็ตฐานข้อมูลใหม่ได้');
  if(!confirm('เซ็ตฐานข้อมูลใหม่ทั้งหมดใช่ไหม?\n\nข้อมูลทุกชีตจะถูกลบ แล้วใส่ข้อมูลตั้งต้นกลับมาใหม่\n(สินค้า 4 รายการ + ผู้ใช้ 4 คน + ข้อมูลตัวอย่าง)\n\n⚠️ ล้างแล้วกู้คืนไม่ได้')) return;
  var typed=prompt('ยืนยันครั้งสุดท้าย — พิมพ์คำว่า RESET แล้วกด OK');
  if(typed!=='RESET'){ toast('ยกเลิกแล้ว ข้อมูลเดิมยังอยู่ครบ'); return; }
  var msg=document.getElementById('resetMsg');
  if(!API){
    // โหมดทดลอง: คืนค่า DEMO จากสแนปช็อตตั้งต้น
    var fresh=JSON.parse(JSON.stringify(DEFAULT_DEMO));
    Object.keys(fresh).forEach(function(k){ DEMO[k]=fresh[k]; });
    localStorage.removeItem('ok1_user');
    if(msg) msg.textContent=' ล้างฐานข้อมูลทดลองแล้ว ✅ กำลังกลับไปหน้า Login';
    toast('เซ็ตฐานข้อมูลใหม่แล้ว ✅');
    setTimeout(function(){ doLogoutSilent(); }, 800);
    return;
  }
  if(msg) msg.textContent=' กำลังล้างฐานข้อมูล...';
  fetch(API,{method:'POST',body:JSON.stringify({action:'resetDatabase'})}).then(function(r){return r.json();}).then(function(j){
    if(j.ok){
      if(msg) msg.textContent=' เซ็ตฐานข้อมูลใหม่แล้ว ✅ กำลังกลับไปหน้า Login (ใช้ผู้ใช้ตั้งต้น 1111 / 2222 / 3333 / 4444)';
      toast('เซ็ตฐานข้อมูลใหม่แล้ว ✅');
      setTimeout(function(){ doLogoutSilent(); loadAll(); }, 1200);
    } else {
      if(msg) msg.textContent='';
      alert('เซิร์ฟเวอร์ยังไม่รองรับปุ่มนี้ (Code.gs เวอร์ชันเก่า)\n\nให้แทนที่ไฟล์ Code.gs ใน Apps Script ด้วยไฟล์ OK1-ERP-Code.gs เวอร์ชันใหม่ที่แนบมา แล้ว Deploy ใหม่ 1 ครั้ง จากนั้นกดปุ่มนี้อีกครั้ง');
    }
  }).catch(function(e){ if(msg) msg.textContent=''; toast('ล้างไม่สำเร็จ: '+e.message); });
}
