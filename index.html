var DEFAULT_DEMO = JSON.parse(JSON.stringify(DEMO));
let ROLE='owner';
let CURRENT='dashboard';
let FILTER={q:'',status:'ทั้งหมด'};
let API=localStorage.getItem('ok1_api')||'';
let LIVE=null; // ข้อมูลจริงจาก Sheet ถ้าเชื่อมแล้ว

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
function setRole(v){ROLE=v;toast('เปลี่ยนบทบาทเป็น: '+v);render();}
function saveApi(){const v=document.getElementById('apiUrl').value.trim();if(!v)return alert('วาง URL Apps Script ก่อน');localStorage.setItem('ok1_api',v);API=v;document.getElementById('conn').textContent='● เชื่อม Google Sheet แล้ว';toast('บันทึก URL แล้ว กำลังโหลดข้อมูลจริง...');loadAll();}
async function loadAll(){
  if(!API) return;
  try{const r=await fetch(API+'?action=getAll');const j=await r.json();if(j.ok&&j.data){LIVE=normalizeData(j.data);document.getElementById('conn').textContent='● เชื่อม Google Sheet แล้ว';render();}}catch(e){toast('เชื่อม Sheet ไม่สำเร็จ: '+e.message);}
}
const SHEETMAP={
 Orders:{'วันที่':'date','เลขที่':'no','ลูกค้า':'customer','สินค้า':'product','จำนวน':'qty','หน่วย':'unit','ยอด':'total','ช่องทาง':'channel','สถานะ':'status','วันที่จัดส่ง':'deliveryDate','หมายเหตุจัดส่ง':'deliveryNote'},
 Products:{'รหัส':'code','สินค้า':'name','หน่วย':'unit','ราคา':'price','สต็อก':'stock','สถานะ':'status'},
 Stock:{'รหัส':'code','วัตถุดิบ':'name','จำนวน':'qty','หน่วย':'unit','ขั้นต่ำ':'min','สถานะ':'status','วันหมดอายุ':'exp'},
 Customers:{'ชื่อลูกค้า':'name','ชื่อ':'name','ประเภท':'type','เบอร์หลัก':'phone','จังหวัด':'province','ที่อยู่':'addr','สถานะ':'status'},
 Suppliers:{'ชื่อซัพพลายเออร์':'name','ชื่อ':'name','เบอร์หลัก':'phone','เครดิต':'credit','สถานะ':'status'},
 Production:{'วันที่':'date','สินค้า':'product','จำนวน':'qty','หน่วย':'unit','คนผลิต':'worker','กะ':'shift','เบิกใช้ผลิต':'material','สถานะ':'status'},
 Accounting:{'เดือน':'month','รายรับ':'income','รายจ่าย':'expense','สถานะ':'status','หมายเหตุ':'note','ล็อคแล้ว':'locked'},
 Users:{'ชื่อผู้ใช้':'name','รหัสผ่าน':'pass','บทบาท':'role','สิทธิ์':'note'},
 BOM:{'รหัสสินค้า':'productCode','สินค้า':'product','วัตถุดิบ':'raw','จำนวนต่อหน่วย':'perUnit','หน่วย':'unit'},
 Dashboard:{'ตัวชี้วัด':'name','ค่า':'price'}};
function toDateOnly(v){ if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(v)) return v.slice(0,10); return v; }
function normalizeRow(r,sheet){const o={};const mp=SHEETMAP[sheet]||{};Object.keys(r||{}).forEach(k=>{const nk=mp[k]||k;o[nk]=toDateOnly(r[k]);});return o;}
function normalizeData(data){const out={};Object.keys(data||{}).forEach(k=>{out[k]=(data[k]||[]).map(function(r){return normalizeRow(r,k);});});return out;}
function dataFor(key){ if(LIVE&&LIVE[key]&&LIVE[key].length) return LIVE[key]; return DEMO[key]||[]; }
function badge(s){
  const m={'รอคอนเฟิร์ม':'warn','รอผลิต':'warn','ส่งแล้ว':'info','สำเร็จ':'ok','สำเร็จ ':'ok','ยกเลิก':'bad','ใช้งาน':'ok','พักการสั่งซื้อ':'bad','วัตถุดิบใกล้หมด':'bad','ปกติ':'ok','ล็อคแล้ว':'bad','ส่งออก':'info'};
  return `<span class="badge ${m[s]||'gray'}">${s}</span>`;
}
function money(n){return Number(n||0).toLocaleString('th-TH')+' ฿';}
function table(heads,rows){return `<div style="overflow-x:auto"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function filterRows(rows,fields){let out=rows;if(FILTER.q){const q=FILTER.q.toLowerCase();out=out.filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(q)));}if(FILTER.status!=='ทั้งหมด'){out=out.filter(r=>Object.values(r).includes(FILTER.status));}return out;}
function searchBar(statuses){return `<div class="toolbar"><input placeholder="🔍 ค้นหา..." value="${FILTER.q}" oninput="FILTER.q=this.value;render()"><select style="max-width:180px" onchange="FILTER.status=this.value;render()"><option>ทั้งหมด</option>${statuses.map(s=>`<option ${FILTER.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn ghost" onclick="FILTER={q:'',status:'ทั้งหมด'};render()">ล้างตัวกรอง</button></div>`;}

function userList(){var live=[];try{live=dataFor('Users');}catch(e){}if(live&&live.length)return live;return DEMO.Users;}
function refreshLoginUsers(){var sel=document.getElementById('loginName');if(!sel)return;var users=userList();var cur=sel.value;sel.innerHTML=users.map(function(u){return '<option value="'+(u.name||'')+'">'+(u.name||'')+' ('+(u.role||'')+')</option>';}).join('');if(cur)sel.value=cur;}
function toggleMobileMenu(forceClose){
  var nav=document.getElementById('nav');var bd=document.getElementById('navBackdrop');if(!nav) return;
  var willOpen = forceClose ? false : !nav.classList.contains('open');
  nav.classList.toggle('open', willOpen);
  if(bd) bd.style.display = willOpen ? 'block' : 'none';
  document.body.style.overflow = willOpen ? 'hidden' : '';

function renderNav(){let g='';var allow=allowedPages();document.getElementById('nav').innerHTML=`<button class="logoutNav" onclick="doLogout()">🚪 ออกจากระบบ</button><button class="closeNav" onclick="toggleMobileMenu(true)">✕ ปิดเมนู</button>`+NAV.filter(function(n){return allow.indexOf(n.k)>=0;}).map(function(n){let h='';if(n.g!==g){g=n.g;h=`<h4>${g.toUpperCase()}</h4>`;}return h+`<button class="${CURRENT===n.k?'active':''}" onclick="go('${n.k}')">${n.i} ${n.t}</button>`;}).join('');renderMobileNav();}
function renderMobileNav(){var el=document.getElementById('mobileNav');if(!el)return;var allow=allowedPages();el.innerHTML=NAV.filter(function(n){return allow.indexOf(n.k)>=0;}).map(function(n){return `<button class="${CURRENT===n.k?'active':''}" onclick="go('${n.k}')">${n.i} ${n.t}</button>`;}).join('')+`<button style="background:#a00!important" onclick="doLogout()">🚪 ออก</button>`;}
function go(k){if(allowedPages().indexOf(k)<0){toast('บทบาทนี้ไม่มีสิทธิ์เข้าเมนูนี้');return;}CURRENT=k;var nv=document.getElementById('nav');if(nv)nv.classList.remove('open');var bd=document.getElementById('navBackdrop');if(bd)bd.style.display='none';document.body.style.overflow='';var hb=document.querySelector('.hamburger');if(hb)hb.textContent='☰ เมนู';render();}
function render(){refreshLoginUsers();renderNav();const el=document.getElementById('page');if(CURRENT==='dashboard')el.innerHTML=pageDashboard();else if(CURRENT==='orders')el.innerHTML=pageOrders();else if(CURRENT==='products')el.innerHTML=pageProducts();else if(CURRENT==='stock')el.innerHTML=pageStock();else if(CURRENT==='customers')el.innerHTML=pageCustomers();else if(CURRENT==='suppliers')el.innerHTML=pageSuppliers();else if(CURRENT==='production')el.innerHTML=pageProduction();else if(CURRENT==='accounting')el.innerHTML=pageAccounting();else if(CURRENT==='users')el.innerHTML=pageUsers();else if(CURRENT==='settings')el.innerHTML=pageSettings();window.scrollTo(0,0);}

function addBom(){
  var sel=(document.getElementById('bomProduct')||{}).value||'';
  var parts=sel.split('|'); var code=parts[0]||'', prod=parts[1]||'';
  var raw=(document.getElementById('bomRaw')||{}).value||'';
  var per=Number((document.getElementById('bomPerUnit')||{}).value||0);
  var unit=(document.getElementById('bomUnit')||{}).value||'กก.';
  var msg=document.getElementById('bomMsg');
  if(!prod||!raw) return alert('เลือกสินค้าและวัตถุดิบก่อน');
  if(!per||per<=0) return alert('ใส่จำนวนต่อ 1 ชิ้น ที่มากกว่า 0');
  var dup=dataFor('BOM').find(function(b){return b.product===prod&&b.raw===raw;});
  if(dup) return alert('สูตรนี้มีอยู่แล้ว: '+prod+' ใช้ '+raw+' — ถ้าจะเปลี่ยนจำนวน ให้ลบสูตรเก่าแล้วเพิ่มใหม่');
  var values=[code,prod,raw,per,unit];
  if(!API){ DEMO.BOM.push({productCode:code,product:prod,raw:raw,perUnit:per,unit:unit}); toast('เพิ่มสูตรแล้ว (โหมดทดลอง)'); render(); return; }
  sheetPost({action:'saveRow',sheet:'BOM',values:values}).then(function(j){ if(j.ok){ if(msg) msg.textContent=' เพิ่มสูตรแล้ว ✅'; toast('เพิ่มสูตรแล้ว ✅'); loadAll(); } else toast('เพิ่มไม่สำเร็จ: '+(j.error||'')); });
}
function deleteBom(full){
  var b=dataFor('BOM')[full]; if(!b) return;
  if(!confirm('ลบสูตรนี้ใช่ไหม?\n'+b.product+' ใช้ '+b.raw+' '+b.perUnit+' '+b.unit+' ต่อ 1 ชิ้น')) return;
  if(!API){ DEMO.BOM.splice(full,1); toast('ลบสูตรแล้ว'); render(); return; }
  // ลบโดยเขียนทับด้วยสูตรที่เหลือทั้งหมด (BOM ไม่มีคีย์แถวเดี่ยว จึงใช้วิธีล้างแล้วเขียนใหม่)
  var rest=dataFor('BOM').filter(function(_,i){return i!==full;});
  sheetPost({action:'resetSheet',sheet:'BOM'}).then(function(){
    var chain=Promise.resolve();
    rest.forEach(function(r){ chain=chain.then(function(){ return sheetPost({action:'saveRow',sheet:'BOM',values:[r.productCode,r.product,r.raw,r.perUnit,r.unit]}); }); });
    chain.then(function(){ toast('ลบสูตรแล้ว ✅'); loadAll(); });
  });
}

// ================== วงจรกลาง: Sheet + สต็อก ==================
// กติกาเดียวทั้งระบบ:
//  - saveRow / updateRowByIndex คือ 2 คำสั่งเดียวที่ใช้เขียนชีต (ไม่มี saveOrder หรือคำสั่งอื่นอีก)
//  - สต็อกสินค้า (Products) เปลี่ยนที่เดียวผ่าน adjustProductStock()
//  - สต็อกวัตถุดิบ (Stock) เปลี่ยนที่เดียวผ่าน adjustRawStock()
//  - ทุกครั้งที่เปลี่ยนสต็อก จะเขียนลงชีตด้วย updateRowByIndex แล้ว loadAll() ใหม่
function sheetPost(body){
  if(!API) return Promise.resolve({ok:true,demo:true});
  return fetch(API,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();});
}
function rowValues(sheet, obj){
  if(sheet==='Orders') return [obj.date||'',obj.no||'',obj.customer||'',obj.product||'',Number(obj.qty||0),obj.unit||'',Number(obj.total||0),obj.channel||'',obj.status||'',obj.deliveryDate||'',obj.deliveryNote||''];
  if(sheet==='Products') return [obj.code||'',obj.name||'',obj.unit||'',Number(obj.price||0),Number(obj.stock||0),obj.status||'ใช้งาน'];
  if(sheet==='Stock') return [obj.code||'',obj.name||'',Number(obj.qty||0),obj.unit||'',Number(obj.min||0),obj.status||'ปกติ',obj.exp||''];
  if(sheet==='Customers') return [obj.name||'',obj.type||'',obj.phone||'',obj.province||'',obj.addr||'',obj.status||'ใช้งาน'];
  if(sheet==='Suppliers') return [obj.name||'',obj.phone||'',obj.credit||'',obj.status||'ใช้งาน'];
  if(sheet==='Production') return [obj.date||'',obj.product||'',Number(obj.qty||0),obj.unit||'',obj.worker||'',obj.shift||'',obj.material||'',obj.status||''];
  if(sheet==='BOM') return [obj.productCode||'',obj.product||'',obj.raw||'',Number(obj.perUnit||0),obj.unit||''];
  if(sheet==='Accounting') return [obj.month||'',Number(obj.income||0),Number(obj.expense||0),obj.status||'',obj.note||'',!!obj.locked];
  return [];
}
function stockStatusFor(qty, min){ return Number(qty) < Number(min||0) ? 'วัตถุดิบใกล้หมด' : 'ปกติ'; }
function adjustProductStock(productName, delta){
  var list=dataFor('Products');
  var idx=-1; for(var i=0;i<list.length;i++){ if(list[i].name===productName) idx=i; }
  if(idx<0) return Promise.resolve({ok:false,error:'ไม่พบสินค้า '+productName});
  var pr=list[idx];
  var next=Number(pr.stock||0)+Number(delta);
  if(next<0) return Promise.resolve({ok:false,error:'สต็อก '+productName+' ไม่พอ (คงเหลือ '+pr.stock+')'});
  var updated={code:pr.code,name:pr.name,unit:pr.unit,price:pr.price,stock:next,status:pr.status};
  if(!API){ if(DEMO.Products[idx]) DEMO.Products[idx].stock=next; return Promise.resolve({ok:true}); }
  return sheetPost({action:'updateRowByIndex',sheet:'Products',rowIndex:idx+2,values:rowValues('Products',updated)}).then(function(j){ if(j.ok&&LIVE&&LIVE.Products&&LIVE.Products[idx]) LIVE.Products[idx].stock=next; return j; });
}
function adjustRawStock(rawName, delta){
  var list=dataFor('Stock');
  var idx=-1; for(var i=0;i<list.length;i++){ if(list[i].name===rawName) idx=i; }
  if(idx<0) return Promise.resolve({ok:false,error:'ไม่พบวัตถุดิบ '+rawName});
  var s=list[idx];
  var next=Number(s.qty||0)+Number(delta);
  if(next<0) return Promise.resolve({ok:false,error:'วัตถุดิบ '+rawName+' ไม่พอ (คงเหลือ '+s.qty+' '+s.unit+')'});
  var updated={code:s.code,name:s.name,qty:next,unit:s.unit,min:s.min,status:stockStatusFor(next,s.min),exp:s.exp};
  if(!API){ if(DEMO.Stock[idx]){ DEMO.Stock[idx].qty=next; DEMO.Stock[idx].status=updated.status; } return Promise.resolve({ok:true}); }
  return sheetPost({action:'updateRowByIndex',sheet:'Stock',rowIndex:idx+2,values:rowValues('Stock',updated)}).then(function(j){ if(j.ok&&LIVE&&LIVE.Stock&&LIVE.Stock[idx]){ LIVE.Stock[idx].qty=next; LIVE.Stock[idx].status=updated.status; } return j; });
}

// ================== BOM (สูตรผลิต) ==================
function bomFor(productName){ return dataFor('BOM').filter(function(b){return b.product===productName;}); }
function bomText(productName, qty){
  var lines=bomFor(productName);
  if(!lines.length) return '— ยังไม่มีสูตร (BOM) —';
  return lines.map(function(b){ return b.raw+' '+(Number(b.perUnit||0)*Number(qty||1))+' '+(b.unit||''); }).join(' • ');
}
function bomCheck(productName, qty){
  var lines=bomFor(productName); var out=[];
  lines.forEach(function(b){
    var need=Number(b.perUnit||0)*Number(qty||0);
    var s=(dataFor('Stock')||[]).find(function(x){return x.name===b.raw;});
    var have=s?Number(s.qty||0):0;
    out.push({raw:b.raw, need:need, unit:b.unit||'', have:have, ok:have>=need});
  });
  return out;
}
function bomTableHTML(productName, qty){
  var chk=bomCheck(productName, qty);
  if(!chk.length) return '<p class="muted">ยังไม่มีสูตร (BOM) ของสินค้านี้ — ไปเพิ่มที่เมนู “สูตรผลิต (BOM)” ด้านล่างของเมนูผลิต แล้วระบบจะตัดวัตถุดิบตามสูตรอัตโนมัติ</p>';
  return '<table><tr><th>วัตถุดิบตามสูตร</th><th>ต้องใช้ (ผลิต '+qty+')</th><th>คงเหลือใน Stock</th><th>พอไหม</th></tr>'+
    chk.map(function(c){ return '<tr><td>'+c.raw+'</td><td>'+c.need+' '+c.unit+'</td><td>'+c.have+' '+c.unit+'</td><td>'+(c.ok?'✅ พอ':'❌ ไม่พอ ขาด '+(c.need-c.have)+' '+c.unit)+'</td></tr>'; }).join('')+'</table>';
}

  set('oCustomer',o.customer); set('oProduct',o.product); set('oQty',o.qty); set('oChannel',o.channel); set('oDeliveryDate',o.deliveryDate); set('oDeliveryNote',o.deliveryNote);
  var title=document.getElementById('ordFormTitle'); if(title) title.textContent='✏️ แก้ไขออเดอร์: '+(o.no||'');

      adjustProductStock(p, -q).then(function(r2){

    if(!r.ok){ if(msg) msg.textContent=''; toast('บันทึกไม่สำเร็จ: '+r.error); return; }
    sheetPost({action:'saveRow',sheet:'Orders',values:valuesNew}).then(function(j){
      if(j.ok){ if(msg) msg.textContent=' บันทึกออเดอร์ '+no+' ลงชีต Orders แล้ว ✅ (ยอด '+total.toLocaleString('th-TH')+' ฿, ตัดสต็อก '+p+' เหลือ '+(Number(prod.stock||0)-q)+' '+unit+')'; toast('บันทึกออเดอร์แล้ว ✅'); loadAll(); }

    });
  });

  if(msg) msg.textContent=' กำลังบันทึก...';

}
function completeProduction(full){
  var pr=dataFor('Production')[full]; if(!pr) return;
  if(pr.status==='สำเร็จ') return toast('ผลิตเสร็จแล้ว');
  var chk=bomCheck(pr.product||'', Number(pr.qty||0));
  if(!chk.length){
    if(!confirm('สินค้านี้ยังไม่มีสูตร (BOM)\n\nยืนยันผลิตสำเร็จ: '+pr.product+' '+pr.qty+' '+(pr.unit||'')+' ใช่ไหม?\n(จะเพิ่มสินค้าเข้าคลังอย่างเดียว ไม่ตัดวัตถุดิบ เพราะไม่มีสูตร)')) return;
  } else {
    var short=chk.filter(function(c){return !c.ok;});
    var detail=chk.map(function(c){return '• '+c.raw+': ต้องใช้ '+c.need+' '+c.unit+' (มี '+c.have+')'+(c.ok?' ✅':' ❌ ขาด '+(c.need-c.have)+' '+c.unit);}).join('\n');
    if(short.length){
      return alert('❌ ผลิตไม่สำเร็จ — วัตถุดิบไม่พอ\n\n'+detail+'\n\nให้ไปสั่งซื้อวัตถุดิบเข้า Stock ก่อน แล้วค่อยกดผลิตสำเร็จ');
    }
    if(!confirm('ยืนยันผลิตสำเร็จ: '+pr.product+' '+pr.qty+' '+(pr.unit||'')+'\n\nระบบจะ:\n• สินค้า '+pr.product+' +'+pr.qty+' เข้าคลัง\n'+detail)) return;
  }
  var doSave=function(){
    var values=[pr.date,pr.product,pr.qty,pr.unit,pr.worker,pr.shift,pr.material,'สำเร็จ'];
    if(!API){ if(DEMO.Production[full]) DEMO.Production[full].status='สำเร็จ'; toast('ผลิตสำเร็จ ✅ สินค้าเข้าคลังแล้ว'); render(); return; }
    sheetPost({action:'updateRowByIndex',sheet:'Production',rowIndex:full+2,values:values}).then(function(j){ if(j.ok){ toast('ผลิตสำเร็จ ✅'); loadAll(); } else toast('บันทึกไม่สำเร็จ: '+(j.error||'')); });
  };
  // ตัดวัตถุดิบทุกตัวตามสูตร ทีละตัว (ถ้าตัวไหนตัดไม่สำเร็จ จะคืนตัวที่ตัดไปแล้วกลับ)
  var deducted=[];
  var chain=Promise.resolve();
  chk.forEach(function(c){
    chain=chain.then(function(){ return adjustRawStock(c.raw,-c.need).then(function(r){ if(!r.ok) throw new Error(r.error); deducted.push(c); return r; }); });
  });
  chain.then(function(){
    return adjustProductStock(pr.product||'', Number(pr.qty||0)).then(function(r2){
      if(!r2.ok){
        var back=Promise.resolve();
        deducted.forEach(function(c){ back=back.then(function(){ return adjustRawStock(c.raw,c.need); }); });
        back.then(function(){ toast('ผลิตไม่สำเร็จ: '+r2.error); });
        return;
      }
      doSave();
    });
  }).catch(function(e){
    var back=Promise.resolve();
    deducted.forEach(function(c){ back=back.then(function(){ return adjustRawStock(c.raw,c.need); }); });
    back.then(function(){ toast('ผลิตไม่สำเร็จ: '+e.message); });
  });
}

function saveStock(){
  var code=(document.getElementById('sCode')||{}).value||'';
  var name=(document.getElementById('sName')||{}).value||'';
  var qty=Number((document.getElementById('sQty')||{}).value||0);
  var unit=(document.getElementById('sUnit')||{}).value||'กก.';
  var min=Number((document.getElementById('sMin')||{}).value||0);
  var exp=(document.getElementById('sExp')||{}).value||'';

function adjustStock(full, dir){
  var s=dataFor('Stock')[full]; if(!s) return;
  var label = dir>0 ? 'รับเข้า' : 'เบิกออก';
  var amt=prompt(label+'วัตถุดิบ: '+s.name+' (คงเหลือ '+s.qty+' '+s.unit+')\nใส่จำนวนที่ต้องการ'+label+' (ใส่ตัวเลขอย่างเดียว)');
  if(amt===null) return;
  amt=Number(amt);
  if(!amt||amt<=0) return alert('ใส่จำนวนที่มากกว่า 0');
  adjustRawStock(s.name, dir*amt).then(function(r){
    if(!r.ok){ toast(label+'ไม่สำเร็จ: '+r.error); return; }
    toast(label+' '+s.name+' '+amt+' '+s.unit+' แล้ว ✅ (คงเหลือ '+(Number(s.qty)+dir*amt)+' '+s.unit+')');
    loadAll();
  });
}
function useStock(i){ adjustStock(i, -1); }

// ================== Login / Logout / Reset ==================
function checkLogin(){
  var u=localStorage.getItem('ok1_user');
  var ls=document.getElementById('loginScreen');
  if(!u){ if(ls) ls.style.display='flex'; return false; }
  try{ var obj=JSON.parse(u); ROLE=obj.role||'owner'; var rs=document.getElementById('roleSel'); if(rs) rs.value=ROLE; }catch(e){}
  if(ls) ls.style.display='none';
  return true;
}
function doLogin(){
  var name=(document.getElementById('loginName')||{}).value||'';
  var pass=(document.getElementById('loginPass')||{}).value||'';
  if(!name) return alert('เลือกชื่อผู้ใช้ก่อน');
  var users=userList(); var found=null;
  for(var i=0;i<users.length;i++){ if(String(users[i].name)===String(name)) found=users[i]; }
  var role=found?(found.role||'owner'):'owner';
  var correct=found?String(found.pass||''):'';
  var ok=false;
  if(correct&&pass===correct) ok=true;
  else if(!correct&&pass==='1234') ok=true;
  else if(pass==='1234'&&!LIVE) ok=true;
  if(!ok){ var e=document.getElementById('loginErr'); if(e) e.style.display='block'; return; }
  localStorage.setItem('ok1_user', JSON.stringify({name:name, role:role}));
  ROLE=role; CURRENT='dashboard';
  var rs=document.getElementById('roleSel'); if(rs) rs.value=role;
  var ls=document.getElementById('loginScreen'); if(ls) ls.style.display='none';
  toast('ยินดีต้อนรับ '+name+' (บทบาท: '+role+')'); render();
}
function doLogout(){
  if(!confirm('ออกจากระบบใช่ไหม?')) return;
  doLogoutSilent();
  toast('ออกจากระบบแล้ว');
}
function doLogoutSilent(){
  localStorage.removeItem('ok1_user');
  var nv=document.getElementById('nav'); if(nv) nv.classList.remove('open');
  var bd=document.getElementById('navBackdrop'); if(bd) bd.style.display='none';
  document.body.style.overflow='';
  var hb=document.querySelector('.hamburger'); if(hb) hb.textContent='☰ เมนู';
  var ls=document.getElementById('loginScreen'); if(ls) ls.style.display='flex';
  var lp=document.getElementById('loginPass'); if(lp) lp.value='';
  var ln=document.getElementById('loginName'); if(ln) ln.value='เจ้าของ';
  refreshLoginUsers();
}
function resetDatabase(){
  if(ROLE!=='owner') return alert('เฉพาะเจ้าของเท่านั้นที่เซ็ตฐานข้อมูลใหม่ได้');
  if(!confirm('เซ็ตฐานข้อมูลใหม่ทั้งหมดใช่ไหม?\n\nข้อมูลทุกชีตจะถูกลบ แล้วใส่ข้อมูลตั้งต้นกลับมาใหม่\n(สินค้า 4 รายการ + ผู้ใช้ 4 คน + ข้อมูลตัวอย่าง)\n\n⚠️ ล้างแล้วกู้คืนไม่ได้')) return;
  var typed=prompt('ยืนยันครั้งสุดท้าย — พิมพ์คำว่า RESET แล้วกด OK');
  if(typed!=='RESET'){ toast('ยกเลิกแล้ว ข้อมูลเดิมยังอยู่ครบ'); return; }
  var msg=document.getElementById('resetMsg');
  if(!API){
    var fresh=JSON.parse(JSON.stringify(DEFAULT_DEMO));
    Object.keys(fresh).forEach(function(k){ DEMO[k]=fresh[k]; });
    localStorage.removeItem('ok1_user');
    if(msg) msg.textContent=' ล้างฐานข้อมูลทดลองแล้ว ✅ กำลังกลับไปหน้า Login';
    toast('เซ็ตฐานข้อมูลใหม่แล้ว ✅');
    setTimeout(function(){ doLogoutSilent(); }, 800);
    return;
  }
  if(msg) msg.textContent=' กำลังล้างฐานข้อมูล...';
  sheetPost({action:'resetDatabase'}).then(function(j){
    if(j.ok){
      if(msg) msg.textContent=' เซ็ตฐานข้อมูลใหม่แล้ว ✅ กำลังกลับไปหน้า Login (ใช้ผู้ใช้ตั้งต้น 1111 / 2222 / 3333 / 4444)';
      toast('เซ็ตฐานข้อมูลใหม่แล้ว ✅');
      setTimeout(function(){ doLogoutSilent(); loadAll(); }, 1200);
    } else {
      if(msg) msg.textContent='';
      alert('เซิร์ฟเวอร์ยังไม่รองรับปุ่มนี้ (Code.gs เวอร์ชันเก่า)\n\nให้แทนที่ไฟล์ Code.gs ใน Apps Script ด้วยไฟล์ OK1-ERP-Code.gs เวอร์ชันใหม่ที่แนบมา แล้ว Deploy ใหม่ 1 ครั้ง จากนั้นกดปุ่มนี้อีกครั้ง');
    }
  }).catch(function(e){ if(msg) msg.textContent=''; toast('ล้างไม่สำเร็จ: '+e.message); });
}
